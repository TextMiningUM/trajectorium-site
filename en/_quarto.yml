project:
  type: website
  output-dir: ../_site/en

lang: en

website:
  title: "Trajectorium — AI, Agents & Energy-Efficient Sovereign Architectures"
  site-url: "https://trajectorium.ai/en"
  site-map: true
  search: true
  open-graph:
    description: "Research, tutorials, and applied cases on AI agents, energy-efficient sovereign architectures, and responsible AI."
    image: "/images/ComponentsofAgent.png"
  twitter-card:
    description: "Research, tutorials, and applied cases on AI agents, energy-efficient sovereign architectures, and responsible AI."
    image: "/images/ComponentsofAgent.png"
    card-style: summary_large_image
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Tutorials"
        href: notebooks/index.qmd
      - text: "Slides"
        href: slides/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "NL"
        href: "https://trajectorium.ai/nl/"

format:
  html:
    theme:
      - cosmo
      - ../custom.scss
    toc: true
    code-fold: true
    code-copy: true
    include-in-header:
      text: |
        <link rel="alternate" hreflang="nl" href="https://trajectorium.ai/nl/" />
        <link rel="canonical" href="https://trajectorium.ai/en/" />

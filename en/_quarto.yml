project:
  type: website
  output-dir: ../_site/en

lang: en

website:
  title: "Trajectorium: AI, Agents & Energy-Efficient Sovereign Architectures"
  site-url: "https://trajectorium.ai/en"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Tutorials"
        href: notebooks/index.qmd
      - text: "Slides"
        href: slides/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - text: "NL"
        href: "https://trajectorium.ai/nl/"

format:
  html:
    theme:
      - cosmo
      - ../custom.scss
    toc: true
    reading-time: true
    code-fold: true
    include-in-header:
      text: |
        <link rel="alternate" hreflang="nl" href="https://trajectorium.ai/nl/" />
        <link rel="canonical" href="https://trajectorium.ai/en/" />
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Trajectorium",
          "url": "https://trajectorium.ai",
          "logo": "https://trajectorium.ai/images/ComponentsofAgent.png",
          "description": "Research and education platform focused on agentic AI, energy-efficient sovereign architectures, and responsible AI.",
          "founder": {
            "@type": "Person",
            "name": "Jan Scholtes",
            "jobTitle": "Endowed Chair of Text Mining",
            "affiliation": "Maastricht University"
          }
        }
        </script>

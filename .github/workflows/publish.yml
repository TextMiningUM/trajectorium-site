name: Render and Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render English site
        working-directory: en
        run: quarto render

      - name: Render Dutch site
        working-directory: nl
        run: quarto render

      - name: Assemble combined site
        run: |
          mkdir -p _publish
          cp index.html _publish/
          cp robots.txt _publish/
          cp -r _site/en _publish/en
          cp -r _site/nl _publish/nl
          cp -r images _publish/images

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

project:
  type: website
  output-dir: ../_site/nl

lang: nl

website:
  title: "Trajectorium — AI, Agents & Energy Efficient Sovereign Architectures"
  site-url: "https://trajectorium.ai/nl"
  site-map: true
  search: true
  open-graph:
    description: "Onderzoek, tutorials en toepassingen op het gebied van AI-agents, energiezuinige soevereine architecturen en verantwoorde AI."
    image: "/images/ComponentsofAgent.png"
  twitter-card:
    description: "Onderzoek, tutorials en toepassingen op het gebied van AI-agents, energiezuinige soevereine architecturen en verantwoorde AI."
    image: "/images/ComponentsofAgent.png"
    card-style: summary_large_image
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Tutorials"
        href: notebooks/index.qmd
      - text: "Slides"
        href: slides/index.qmd
      - text: "Over"
        href: about.qmd
    right:
      - text: "EN"
        href: "https://trajectorium.ai/en/"

format:
  html:
    theme:
      - cosmo
      - ../custom.scss
    toc: true
    code-fold: true
    code-copy: true
    include-in-header:
      text: |
        <link rel="alternate" hreflang="en" href="https://trajectorium.ai/en/" />
        <link rel="canonical" href="https://trajectorium.ai/nl/" />

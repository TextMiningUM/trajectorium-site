project:
  type: website
  output-dir: ../_site/nl

lang: nl

website:
  title: "Trajectorium — AI, Agents & Energy Efficient Sovereign Architectures"
  site-url: "https://trajectorium.ai/nl"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Tutorials"
        href: notebooks/index.qmd
      - text: "Slides"
        href: slides/index.qmd
      - text: "Over"
        href: about.qmd
    right:
      - text: "EN"
        href: "https://trajectorium.ai/en/"

format:
  html:
    theme:
      - cosmo
      - ../custom.scss
    toc: true
    code-fold: true
    include-in-header:
      text: |
        <link rel="alternate" hreflang="en" href="https://trajectorium.ai/en/" />
        <link rel="canonical" href="https://trajectorium.ai/nl/" />
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Trajectorium",
          "url": "https://trajectorium.ai",
          "logo": "https://trajectorium.ai/images/ComponentsofAgent.png",
          "description": "Onderzoeks- en onderwijsplatform gericht op agentic AI, energiezuinige soevereine architecturen en verantwoorde AI.",
          "founder": {
            "@type": "Person",
            "name": "Jan Scholtes",
            "jobTitle": "Endowed Chair of Text Mining",
            "affiliation": "Maastricht University"
          }
        }
        </script>
